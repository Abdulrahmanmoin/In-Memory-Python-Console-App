apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.configMapName" . }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  # Backend URL for Next.js client-side access
  # Uses override if set (for Minikube), otherwise uses internal service name (for production)
  {{- if .Values.configMap.NEXT_PUBLIC_API_URL_OVERRIDE }}
  NEXT_PUBLIC_API_URL: {{ .Values.configMap.NEXT_PUBLIC_API_URL_OVERRIDE | quote }}
  {{- else }}
  NEXT_PUBLIC_API_URL: "http://{{ include "todo-chatbot.backend.serviceName" . }}:{{ .Values.backend.service.port }}"
  {{- end }}
  # Node environment setting
  NODE_ENV: {{ .Values.configMap.NODE_ENV | quote }}
  # Logging level
  LOG_LEVEL: {{ .Values.configMap.LOG_LEVEL | quote }}
